<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考英语语法思维导图 - 考前扫盲</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --paper: #FAF6F1;
  --card: #FFFCFA;
  --ink: #4A433E;
  --ink-soft: #8A8178;
  --ink-faint: #B4AAA2;
  --line: rgba(180, 150, 140, 0.18);
  --accent: #C9A39C;
  --accent-soft: #F4E8E4;
  --rose: #E8C4BE;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --tile: #F0D9D5;
  --tile-fg: #8F6863;
  --text-primary: var(--ink);
  --text-secondary: var(--ink-soft);
  --border: var(--line);
  --accent-light: var(--accent-soft);
}
html {
  width: 100%;
  overflow-x: hidden;
}
body {
  font-family: var(--font-sans);
  background:
    radial-gradient(ellipse 90% 55% at 12% -8%, rgba(232, 196, 188, 0.35), transparent 52%),
    radial-gradient(ellipse 70% 45% at 100% 0%, rgba(214, 226, 216, 0.32), transparent 48%),
    #FAF6F1;
  color: var(--ink);
  line-height: 1.65;
  padding-bottom: 88px;
  min-height: 100dvh;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: rgba(255, 252, 250, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--ink);
  padding: 22px 20px 16px;
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--line);
}
.header h1 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: 0.04em;
  text-wrap: balance;
  color: #5C534C;
}
.header p {
  font-size: 14px;
  color: var(--ink-soft);
}
.header .tip {
  margin-top: 10px;
  font-size: 12px;
  color: #9A6B66;
  background: var(--accent-soft);
  display: inline-block;
  padding: 5px 12px;
  border-radius: 999px;
  font-weight: 500;
  letter-spacing: 0.06em;
}
.header a.tip {
  text-decoration: none;
  margin-left: 8px;
}
.desk {
  max-width: 1120px;
  width: 100%;
  margin: 0 auto;
  padding: 8px 12px 0;
  min-width: 0;
}
.quick-nav {
  display: flex;
  overflow-x: auto;
  padding: 12px 0 4px;
  gap: 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  min-width: 0;
  width: 100%;
}
.quick-nav::-webkit-scrollbar { display: none; }
.qnav-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  transition: transform 160ms var(--ease-out), background 200ms ease, color 200ms ease;
}
.qnav-btn:active { transform: scale(0.97); }

.folder {
  margin: 12px 0 0;
  background: var(--card);
  border-radius: 22px;
  padding: 16px 16px 18px;
  box-shadow: 0 8px 24px rgba(180, 140, 130, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.8);
  min-width: 0;
  overflow: hidden;
}
.folder-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 6px 12px;
}
.folder-icon {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
  background: var(--tile);
  color: var(--tile-fg);
}
.folder-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 0.01em;
}
.folder-sub {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.icon-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 12px 4px;
  padding: 4px 2px 0;
}
.desk-icon {
  width: 100%;
  min-width: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 6px 4px 4px;
  border-radius: 14px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 160ms var(--ease-out), background 200ms ease;
  position: relative;
}
.desk-icon:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.desk-icon:active { transform: scale(0.97); }
.desk-glyph {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--tile-fg);
  position: relative;
  background: var(--tile);
  box-shadow: 0 6px 14px rgba(180, 140, 130, 0.12);
  letter-spacing: 0.04em;
}
.desk-label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-primary);
  text-align: center;
  line-height: 1.35;
  max-width: 92px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.desk-icon.reviewed .desk-glyph::after {
  content: "";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #8FA392;
  box-shadow: 0 0 0 2px var(--card);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='white' d='M6.4 11.2 3.2 8l1.1-1.1 2.1 2.1 5.3-5.3L12.8 5z'/></svg>");
  background-size: 12px;
  background-repeat: no-repeat;
  background-position: center;
}
.desk-icon.reviewed .desk-label { color: var(--ink-soft); }

.progress-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  background: rgba(255, 252, 250, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 12px 16px;
  box-shadow: 0 -2px 16px rgba(180, 140, 130, 0.1);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar .pg-info {
  font-size: 13px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.progress-bar .pg-track {
  flex: 1;
  height: 5px;
  background: var(--accent-soft);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar .pg-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 220ms var(--ease-out);
  width: 0%;
}
.btn-all {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: transform 160ms var(--ease-out);
}
.btn-all:active { transform: scale(0.97); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(90, 70, 66, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 240ms var(--ease-out);
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-sheet {
  width: min(760px, 100%);
  max-height: min(86dvh, 860px);
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(160, 120, 112, 0.22);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.96) translateY(10px);
  opacity: 0;
  transition: transform 260ms var(--ease-out), opacity 220ms var(--ease-out);
}
.modal-backdrop.open .modal-sheet {
  transform: scale(1) translateY(0);
  opacity: 1;
}
.modal-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-kicker {
  font-size: 12px;
  font-weight: 600;
  color: #9A6B66;
  margin-bottom: 4px;
  letter-spacing: 0.08em;
}
.modal-title {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.3;
  text-wrap: balance;
}
.modal-close {
  margin-left: auto;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 160ms var(--ease-out), background 200ms ease;
}
.modal-close:active { transform: scale(0.97); }
.modal-body {
  overflow: auto;
  padding: 18px 20px 28px;
  font-size: 17px;
  line-height: 1.8;
  color: var(--text-primary);
  -webkit-overflow-scrolling: touch;
}
.modal-body .detail-item {
  font-size: 17px;
  line-height: 1.8;
  padding: 10px 0 10px 14px;
  color: var(--text-primary);
  border-left: 3px solid var(--border);
  margin: 8px 0;
}
.modal-body .label {
  font-weight: 700;
  color: var(--text-primary);
  font-size: 17.5px;
  display: inline;
}
.modal-body .eg {
  color: var(--text-secondary);
  font-size: 16.5px;
  display: block;
  margin-top: 6px;
  padding-left: 10px;
  border-left: 2px dashed var(--border);
  line-height: 1.75;
}
.modal-body .highlight-box {
  background: #F4E8E4;
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  margin: 12px 0;
  border-radius: 0 10px 10px 0;
  font-size: 16.5px;
  line-height: 1.75;
}
.modal-body .hb-title {
  font-weight: 700;
  color: #9A6B66;
  font-size: 15px;
  margin-bottom: 6px;
  letter-spacing: 0.08em;
}
.modal-body .compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15.5px;
  margin: 10px 0;
}
.modal-body .compare-table th {
  background: var(--accent-soft);
  padding: 10px 12px;
  text-align: left;
  font-weight: 650;
  font-size: 15px;
  color: var(--ink);
  border: 1px solid var(--line);
}
.modal-body .compare-table td {
  padding: 9px 12px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  line-height: 1.65;
}
.modal-body .formula {
  background: var(--accent-soft);
  padding: 12px 14px;
  border-radius: 10px;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 16px;
  margin: 10px 0;
  color: var(--ink);
  letter-spacing: 0.2px;
}
.modal-body .tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 650;
  margin-right: 4px;
}
body.modal-open { overflow: hidden; }

@media (hover: hover) and (pointer: fine) {
  .desk-icon:hover { background: var(--accent-soft); }
  .qnav-btn:hover { background: var(--accent-soft); color: #9A6B66; }
  .modal-close:hover { background: #EBD6D1; }
}
@media (max-width: 520px) {
  .icon-row { grid-template-columns: repeat(3, 1fr); }
  .desk-glyph { width: 52px; height: 52px; }
  .modal-title { font-size: 20px; }
  .modal-body, .modal-body .detail-item, .modal-body .label { font-size: 16.5px; }
  .progress-bar { gap: 8px; padding: 10px 12px; }
  .progress-bar .pg-info { font-size: 12px; max-width: 38%; overflow: hidden; text-overflow: ellipsis; }
  .btn-all { padding: 8px 10px; font-size: 12px; flex-shrink: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .modal-backdrop, .modal-sheet, .desk-icon, .qnav-btn, .btn-all, .modal-close, .progress-bar .pg-fill {
    transition: none;
  }
}
</style>
</head>
<body>
<div class="header">
  <h1>高考英语语法 · 考前扫盲导图</h1>
  <p>知识点按桌面图标横排整理，点开即可复习</p>
  <div class="tip">点击知识点查看详情 · 共 11 大语法体系</div>
  <a class="tip" href="goodnotes/gaokao-class-progress-goodnotes.pdf">课堂进度 GoodNotes 模板</a>
</div>

<div class="desk">
  <div class="quick-nav" id="qnav"></div>
  <div id="content"></div>
</div>

<div class="progress-bar">
  <span class="pg-info" id="pgText">已复习 0 / 0 个知识点</span>
  <div class="pg-track"><div class="pg-fill" id="pgFill"></div></div>
  <button class="btn-all" type="button" onclick="markAllRead()">全部已复习</button>
</div>

<div class="modal-backdrop" id="topicModal" aria-hidden="true">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div>
        <div class="modal-kicker" id="modalKicker"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
      </div>
      <button class="modal-close" type="button" onclick="closeModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

const DATA = [
{
  id: 'noun', icon: '名', title: '名词 Nouns', sub: '数·格·主谓一致', bg: 'var(--cat-noun)', tx: 'var(--cat-noun-tx)', bd: 'var(--cat-noun-bd)',
  subs: [
    {
      title: '可数与不可数',
      dot: '#1967D2',
      items: [
        '<span class="label">可数名词复数规则：</span>',
        '<div class="eg">一般加-s：book→books</div><div class="eg">以s/x/z/ch/sh结尾加-es：bus→buses, box→boxes</div><div class="eg">辅音+y变i+es：city→cities；元音+y直接+s：boy→boys</div><div class="eg">f/fe变v+es：knife→knives（但roof→roofs）</div><div class="eg">o结尾：hero/tomato/potato+es；photo/piano/radio+s</div>',
        '<span class="label">不可数名词要点：</span>',
        '<div class="eg">常见：advice, news, information, furniture, equipment, weather, progress, homework, housework, fun, luck, wealth, knowledge, bread, water, rice, meat</div><div class="eg">抽象名词一般不可数：happiness, freedom, courage, honesty</div><div class="eg">不可数名词用量词计量：a piece of advice / two pieces of furniture</div>',
        '<div class="highlight-box"><div class="hb-title">高频考点</div>people/police/cattle 单复同形，作主语谓语用复数<br>news/mathematics/physics 形式复数意义单数，谓语用单数</div>'
      ]
    },
    {
      title: '名词所有格',
      dot: '#1565C0',
      items: [
        '<span class="label">\'s 所有格：</span><div class="eg">Tom\'s book, the teacher\'s desk</div><div class="eg">以s结尾的复数只加\'：students\' books, teachers\' office</div><div class="eg">共有/分别：Tom and Mary\'s room（共用）；Tom\'s and Mary\'s rooms（各自）</div>',
        '<span class="label">of 所有格：</span><div class="eg">the door of the room, the cover of the book</div><div class="eg">用于无生命的东西（但有\'s例外：today\'s newspaper, ten minutes\' walk）</div>',
        '<span class="label">双重所有格：</span>a friend <strong>of my father\'s</strong> = 我父亲的一个朋友（强调"其中之一"）'
      ]
    },
    {
      title: '主谓一致',
      dot: '#0D47A1',
      items: [
        '<span class="label">就近原则（or, either...or, neither...nor, not only...but also）：</span><div class="eg">Either you or I <strong>am</strong> wrong.</div><div class="eg">Neither he nor they <strong>are</strong> responsible.</div>',
        '<span class="label">就远原则（with/together with/as well as/but/except + 名词）：</span><div class="eg">The teacher together with his students <strong>is</strong> going to the museum.</div><div class="eg">Nobody but you and I <strong>was</strong> there.</div>',
        '<span class="label">集合名词辨析：</span>',
        '<table class="compare-table"><tr><th>强调整体（单数）</th><th>强调个体（复数）</th></tr><tr><td>class, family, team, audience, crew, government, public, group</td><td>当成员分别行动时用复数</td></tr></table><div class="eg">The family <strong>is</strong> large.（整体）<br>The family <strong>are</strong> watching TV.（每个成员）</div>',
        '<span class="label">数量词+主语：</span><div class="eg">the number of + 复数名词 → 谓语<strong>单数</strong></div><div class="eg">a number of + 复数名词 → 谓语<strong>复数</strong></div><div class="eg">every/each/no + 单数名词 → 谓语<strong>单数</strong></div><div class="eg">many a + 单数名词 → 谓语<strong>单数</strong>（意为许多）</div><div class="eg">more than one + 单数名词 → 谓语<strong>单数</strong></div>',
        '<div class="highlight-box"><div class="hb-title">易错提醒</div>one of + 复数名词 + who/that → 从句中动词用<strong>复数</strong>（最近原则）<br>the only one of + 复数名词 + who/that → 从句中动词用<strong>单数</strong></div>'
      ]
    }
  ]
},
{
  id: 'pronoun', icon: '代', title: '代词 Pronouns', sub: '人称·物主·反身·不定·关系', bg: 'var(--cat-pronoun)', tx: 'var(--cat-pronoun-tx)', bd: 'var(--cat-pronoun-bd)',
  subs: [
    {
      title: '人称代词与物主代词',
      dot: '#7C3AED',
      items: [
        '<span class="label">人称代词主格 vs 宾格：</span><table class="compare-table"><tr><th>主格（做主语）</th><th>宾格（做宾语）</th></tr><tr><td>I, we, you, he/she/it, they</td><td>me, us, you, him/her/it, them</td></tr></table>',
        '<span class="label">形容词性物主代词 vs 名词性物主代词：</span><table class="compare-table"><tr><th>形容词性（后接名词）</th><th>名词性（独立使用=形物+名词）</th></tr><tr><td>my, your, his/her/its/our/their</td><td>mine, yours, his/hers/its/ours/theirs</td></tr></table><div class="eg">This is <strong>my</strong> book. = This book is <strong>mine</strong>.</div>',
        '<div class="highlight-box"><div class="hb-title">高考常考</div>it 的用法：指代上文提到的事物、时间、距离、天气、环境等<br>It is no use/good doing sth.<br>It takes sb some time to do sth.<br>I find it + adj./n. + to do sth.</div>'
      ]
    },
    {
      title: '反身代词',
      dot: '#6D28D9',
      items: [
        '<span class="label">反身代词列表：</span>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves',
        '<span class="label">常见搭配：</span><div class="eg">by oneself = 独自地（alone）</div><div class="eg">enjoy oneself = 玩得开心</div><div class="eg">help oneself to... = 随便吃...</div><div class="eg">teach oneself = 自学</div><div class="eg">devote oneself to = 致力于</div><div class="eg">come to oneself = 苏醒</div>'
      ]
    },
    {
      title: '指示代词与不定代词',
      dot: '#5B21B6',
      items: [
        '<span class="label">this/these vs that/those：</span>this/these 指近处/即将提到；that/those 指远处/已提到（避免重复）',
        '<span class="label">such 用法：</span>such + a/an + adj. + 单数名词；such + adj. + 复数名词',
        '<span class="label">same 前必须加 the：</span>the same ... as ...',
        '<span class="label">both/either/neither（两者）：</span><div class="eg">both → 两者都（肯定）</div><div class="eg">either → 两者之一</div><div class="eg">neither → 两者都不（否定）</div>',

let totalSubs = 0;
let openedSubs = new Set();

const TILES = [
  { bg: '#F0D9D5', fg: '#8F6863' },
  { bg: '#E8DCC8', fg: '#7A6B52' },
  { bg: '#D7E2D6', fg: '#5F735E' },
  { bg: '#DDD8E6', fg: '#6A6578' },
  { bg: '#F0DDD0', fg: '#8A6A58' },
  { bg: '#D5E0E5', fg: '#5A6E76' },
  { bg: '#E8D4D8', fg: '#7A5E66' },
  { bg: '#EBE4C8', fg: '#7A7048' },
  { bg: '#E2DFD6', fg: '#6A6660' },
  { bg: '#D8E4DC', fg: '#5A7264' },
  { bg: '#E8D8CC', fg: '#7A6458' }
];

function glyphText(title, index) {
  const compact = title.replace(/[A-Za-z0-9\s·—&/（）()]/g, '');
  return (compact.slice(0, 2) || String(index + 1));
}

function render() {
  const qnav = document.getElementById('qnav');
  const content = document.getElementById('content');
  totalSubs = 0;
  let qnavHtml = '';
  let catHtml = '';

  DATA.forEach((cat, ci) => {
    qnavHtml += `<button class="qnav-btn" type="button" onclick="jumpTo(${ci})">${cat.icon} ${cat.title.split(' ')[0]}</button>`;
    totalSubs += cat.subs.length;

    const tile = TILES[ci % TILES.length];
    catHtml += `<section class="folder" id="cat-${ci}" style="--tile:${tile.bg};--tile-fg:${tile.fg}">
      <div class="folder-head">
        <div class="folder-icon">${cat.icon}</div>
        <div>
          <div class="folder-title">${cat.title}</div>
          <div class="folder-sub">${cat.sub} · ${cat.subs.length} 个知识点</div>
        </div>
      </div>
      <div class="icon-row">`;

    cat.subs.forEach((sub, si) => {
      const subId = `${cat.id}-${si}`;
      catHtml += `<button class="desk-icon" type="button" id="${subId}" onclick="openTopic(${ci}, ${si})">
        <span class="desk-glyph">${glyphText(sub.title, si)}</span>
        <span class="desk-label">${sub.title}</span>
      </button>`;
    });

    catHtml += `</div></section>`;
  });

  qnav.innerHTML = qnavHtml;
  content.innerHTML = catHtml;
  updateProgress();
}

function openTopic(ci, si) {
  const cat = DATA[ci];
  const sub = cat.subs[si];
  const subId = `${cat.id}-${si}`;
  openedSubs.add(subId);
  document.getElementById(subId)?.classList.add('reviewed');
  updateProgress();

  document.getElementById('modalKicker').textContent = cat.title;
  document.getElementById('modalTitle').textContent = sub.title;
  document.getElementById('modalBody').innerHTML = sub.items.map(item => `<div class="detail-item">${item}</div>`).join('');

  const modal = document.getElementById('topicModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
}

function closeModal() {
  const modal = document.getElementById('topicModal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('modal-open');
}

function updateProgress() {
  const pct = totalSubs ? Math.round(openedSubs.size / totalSubs * 100) : 0;
  document.getElementById('pgFill').style.width = pct + '%';
  document.getElementById('pgText').textContent = `已复习 ${openedSubs.size} / ${totalSubs} 个知识点`;
}

function jumpTo(ci) {
  document.getElementById(`cat-${ci}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function markAllRead() {
  DATA.forEach((cat, ci) => {
    cat.subs.forEach((_, si) => {
      const id = `${cat.id}-${si}`;
      openedSubs.add(id);
      document.getElementById(id)?.classList.add('reviewed');
    });
  });
  updateProgress();
}

document.getElementById('topicModal').addEventListener('click', (e) => {
  if (e.target.id === 'topicModal') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
